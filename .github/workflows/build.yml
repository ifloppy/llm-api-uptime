name: Build and Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - run: go vet ./...
      - run: go test -v -cover ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          BINARY="llm-api-uptime"
          if [ "$GOOS" = "windows" ]; then BINARY="${BINARY}.exe"; fi
          go build -ldflags="-s -w" -o "dist/${BINARY}" .
          cp .env.example "dist/"

      - uses: actions/upload-artifact@v4
        with:
          name: llm-api-uptime-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
